<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Arena Replay - Login</title>

<style>

body{

    margin:0;

    background:#0f172a;

    font-family:Arial;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

}

.card{

    width:360px;

    background:white;

    border-radius:12px;

    padding:30px;

    box-shadow:0 15px 35px rgba(0,0,0,.3);

}

h1{

    text-align:center;

    margin-bottom:25px;

}

input{

    width:100%;

    padding:12px;

    margin-top:10px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:16px;

}

button{

    width:100%;

    margin-top:20px;

    padding:14px;

    background:#00a651;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:18px;

}

.erro{

    color:red;

    text-align:center;

    margin-top:10px;

}

</style>

</head>

<body>

<div class="card">

<h1>Arena Replay</h1>

<form method="POST">

<input
type="text"
name="usuario"
placeholder="Usuário"
required>

<input
type="password"
name="senha"
placeholder="Senha"
required>

<button>

Entrar

</button>

</form>

{% if erro %}

<p class="erro">

{{ erro }}

</p>

{% endif %}

</div>

</body>

</html>
