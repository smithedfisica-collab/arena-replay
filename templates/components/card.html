<div class="card">

    <div class="card-icon">
        <i class="bi bi-{{ icon }}"></i>
    </div>

    <div class="card-title">
        {{ title }}
    </div>

    <div class="card-value">
        {{ value }}
    </div>

    {% if subtitle %}

    <div class="card-subtitle">
        {{ subtitle }}
    </div>

    {% endif %}

</div>
